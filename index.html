<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>MtG DeckMaster</title>
<style>
:root{color-scheme:dark;--bg:#14121a;--card:#1f1b2a;--card2:#2a2438;--tx:#eee;--mut:#9a93ad;--ac:#8b6cf0;--gold:#f1c40f;--bad:#e5574f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
#main{max-width:1100px;margin:0 auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
h2{margin:.3em 0}h3{margin:1em 0 .4em}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.tile{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.art{aspect-ratio:488/680;background:var(--card2);position:relative}.art img{width:100%;height:100%;object-fit:cover;display:block}
.ph{padding:10px;font-size:13px;color:var(--mut);display:flex;height:100%;align-items:center;justify-content:center;text-align:center}
.badge{position:absolute;right:6px;top:6px;background:#000c;color:var(--gold);border-radius:8px;padding:1px 7px;font-weight:700}
.nm{padding:6px 8px;font-size:13px}.ctl{display:flex;gap:6px;padding:0 8px 8px}.ctl button{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.stats div{background:var(--card);border-radius:10px;padding:8px 12px;flex:1;min-width:90px;font-size:12px;color:var(--mut)}.stats b{display:block;font-size:20px;color:var(--tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
input,select,textarea,button,.btn{font:inherit;color:var(--tx);background:var(--card2);border:1px solid #3a3350;border-radius:10px;padding:10px 12px}
input[type=search],.bar input{flex:2;min-width:160px}select{flex:1}textarea{width:100%}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input:not([type=checkbox]),select{max-width:100%}.f input,.f select{width:100%}
button,.btn{cursor:pointer;display:inline-block;text-align:center}.pri{background:var(--ac);border-color:var(--ac);font-weight:600}.danger{color:var(--bad)}.big{width:100%;padding:18px;font-size:17px;margin:8px 0}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e0c13;border-top:1px solid #2a2438;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:10px 4px;font-size:12px}#nav button span{display:block;font-size:20px}#nav .on{color:var(--gold)}
.modal{position:fixed;inset:0;background:#000b;display:none;z-index:30;overflow:auto}.modal.open{display:block}
.sheet{background:var(--bg);max-width:900px;margin:20px auto;border-radius:14px;padding:16px;min-height:100px;position:relative}.x{position:absolute;right:10px;top:10px}
.cd{display:grid;grid-template-columns:minmax(200px,420px) 1fr;gap:16px}.cd img,.cmp img{width:100%;border-radius:12px}@media(max-width:520px){.cd{grid-template-columns:1fr}}
.tags span{display:inline-block;background:var(--card2);border-radius:20px;padding:2px 10px;margin:2px 4px 2px 0;font-size:12px}
pre{white-space:pre-wrap;font:inherit;background:var(--card);padding:10px;border-radius:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}
.deck{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}.deck:hover{background:var(--card2)}
.curve{display:flex;gap:6px;align-items:flex-end;height:90px;margin:8px 0}.curve div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.curve i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid #2a2438;text-align:left;vertical-align:top}th{color:var(--mut);position:sticky;top:0;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button.on{background:var(--ac)}
.sug div,.res{padding:10px;background:var(--card);border-radius:8px;margin:4px 0;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.warn{background:#4a2a10;border-radius:10px;padding:10px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000e;padding:10px 16px;border-radius:20px;z-index:50;display:none}
input[type=checkbox]{width:auto;margin-right:8px}.f input[type=checkbox]{width:auto}
.dot{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-right:.35em;border:1px solid #fff5}
.swr{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid #fff3}.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.artwrap{position:relative}.artbtn{position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:50%;padding:0;font-size:21px;background:#000c;border:1px solid #fff5}
.lk{color:var(--gold);text-decoration:underline;cursor:pointer}.sheet .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}.sheet .nm{font-size:11px;padding:4px 6px}
.vf{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#000c;color:var(--gold);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.vfbtn{position:absolute;left:8px;top:8px;width:46px;height:46px;border-radius:50%;padding:0;font-size:24px;font-weight:900;color:var(--gold);background:#000c;border:2px solid var(--gold)}
ol.st{padding-left:20px;margin:6px 0;color:var(--mut)}ol.st li{margin:3px 0}a{color:var(--gold)}
#prog{font-size:12px;color:var(--mut);padding:4px 12px}
</style></head><body>
<div id="prog"></div><div id="main">Loading…</div><nav id="nav"></nav>
<div id="modal" class="modal"><div class="sheet"><button class="x" onclick="closeM()">✕</button><div id="mbody"></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS='';const LS='mtg_state_v1'+NS,AS='mtg_art_v1'+NS,BK='mtg_backup_v1'+NS,DY='mtg_dirty_v1'+NS;const EMPTY={cards:[],decks:[],swaps:[],matchups:[],sleeves:['Pink','Purple','Light Pink','Light Blue','Blue','Red','Light Green','Green','Yellow','Orange','White','Black'].map(color=>({color,total:0,deck:'',inUse:0}))};
let IDX=null,D,A={step:'start'},PD='',ART={};try{ART=JSON.parse(localStorage.getItem(AS)||'{}')}catch(e){}
const V={view:'collection',q:'',type:'',color:'',deck:null,sub:'log'};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){toast('Storage full — export a backup!')}};
const save=()=>{IDX=null;persist();try{localStorage.setItem(DY,'1')}catch(e){}};
const saveArt=()=>{try{localStorage.setItem(AS,JSON.stringify(ART))}catch(e){}};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),front=s=>String(s).split(' // ')[0];
const today=()=>new Date().toISOString().slice(0,10),sum=(a,f=x=>x.qty)=>a.reduce((s,x)=>s+f(x),0);
const isReal=c=>!['Token','Accessory'].includes(c.type);
const findCard=n=>(IDX||(IDX=new Map([...D.cards].reverse().map(c=>[norm(front(c.name)),c])))).get(norm(front(n)));
const usage=n=>D.decks.map(d=>({d,q:sum(d.cards.filter(x=>norm(x.name)===norm(n)))})).filter(x=>x.q>0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const openM=h=>{$('#mbody').innerHTML=h;$('#modal').classList.add('open')},closeM=()=>$('#modal').classList.remove('open');
const imgErr=i=>{if(i.src.includes('/large/')){i.src=i.src.replace('/large/','/normal/');return}if(i.crossOrigin){i.removeAttribute('crossorigin');i.src=i.src}else i.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:i.alt}))};
const artOf=n=>{const c=findCard(n);return (c&&c.art)||ART[n]||''};
const imgTag=(n,cls='',big)=>{let u=artOf(n);if(!u)return '';if(big)u=u.replace('/normal/','/large/');return `<img ${cls} loading="lazy" crossorigin="anonymous" src="${esc(u)}" alt="${esc(n)}" onerror="imgErr(this)">`};
const cl=n=>`<span class="lk" data-card="${esc(n)}">${esc(n)}</span>`;
const noEmoji=s=>String(s??'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/\s+/g,' ').trim();
const cell=x=>x&&x.h!==undefined?x.h:esc(x);
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${cell(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const SLV={pink:'#ff5fa2','light pink':'#ffc2dd',purple:'#8e44ad',red:'#e53935','light blue':'#7fc8ff',blue:'#2f6df6','light green':'#9be37a',green:'#2e9e44',yellow:'#ffd400',orange:'#ff8c1a',white:'#ffffff',black:'#0b0b0b'};
const title=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const sleeveBg=s=>s.img?`url(${s.img}) center/cover`:(s.hex||SLV[noEmoji(s.color).toLowerCase()]||'#888');
const sl=n=>{const c=noEmoji(n);if(!c||c==='—')return '—';const s=D.sleeves.find(x=>noEmoji(x.color).toLowerCase()===c.toLowerCase());return `<span class="dot" style="background:${s?sleeveBg(s):SLV[c.toLowerCase()]||'#888'}"></span>${esc(title(c))}`};
let last=0;async function scry(p){await new Promise(r=>setTimeout(r,Math.max(0,110-(Date.now()-last))));last=Date.now();
  try{const r=await fetch(p.startsWith('http')?p:'https://api.scryfall.com'+p,{headers:{Accept:'application/json'}});return r.ok?await r.json():null}catch(e){return null}}
const sImg=c=>c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||'';

/* ---------- startup ---------- */
async function init(){
  const s=localStorage.getItem(LS);
  try{D=s?JSON.parse(s):await startData()}catch(e){$('#main').textContent='Could not load your data.';return}
  D.acq=D.acq||[];if(!s)persist();render();fetchArt();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
async function fetchArt(){
  const names=[...new Set([...D.cards.filter(isReal).map(c=>c.name),...D.decks.flatMap(d=>d.cards.map(c=>c.name))])].filter(n=>!(n in ART));
  if(!names.length)return;let miss=[],done=0;
  for(let i=0;i<names.length;i+=75){
    const chunk=names.slice(i,i+75);$('#prog').textContent=`Fetching card artwork… ${done}/${names.length}`;
    try{const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({identifiers:chunk.map(name=>({name:front(name)}))})});
      const j=await r.json(),m={};(j.data||[]).forEach(c=>m[norm(front(c.name))]=sImg(c));
      chunk.forEach(n=>{const u=m[norm(front(n))];u?ART[n]=u:miss.push(n)})}catch(e){$('#prog').textContent='Artwork needs an internet connection — will retry next launch.';return}
    done+=chunk.length;saveArt();if(V.view==='collection')drawList()}
  for(const n of miss){const c=await scry('/cards/named?fuzzy='+encodeURIComponent(front(n)));ART[n]=c&&c.object==='card'?sImg(c):'';done++;$('#prog').textContent=`Matching odd names… ${done}/${names.length}`}
  saveArt();$('#prog').textContent='';render();
}

/* ---------- shell ---------- */
const NAV=[['collection','🃏','Collection'],['decks','📚','Decks'],['add','➕','Add card'],['ai','✨','AI deck'],['more','⚙️','More']];
function render(){
  $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${V.view===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  ({collection:vCollection,decks:vDecks,add:vAdd,ai:vAI,more:vMore})[V.view]($('#main'));
  const due=backupDue();if(due&&!(V.view==='more'&&V.sub==='backup'))$('#main').insertAdjacentHTML('afterbegin',`<div class="warn">💾 ${esc(due)} <button style="margin-left:8px;padding:6px 10px" onclick="V.view='more';V.sub='backup';render()">Back up now</button></div>`);
}
function go(k){V.view=k;V.deck=null;render();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target;let b;
  if(b=t.closest('[data-dec]'))return chg(b.dataset.dec,-1);if(b=t.closest('[data-inc]'))return chg(b.dataset.inc,1);
  if(b=t.closest('[data-pd]'))return pickDeck(b.dataset.pd);if(b=t.closest('[data-adc]'))return confirm(`Add ${b.dataset.adc} to ${D.decks[V.deck].name}?`)&&(addToDeck(V.deck,b.dataset.adc,1),deckSearch());
  if(b=t.closest('[data-vf]'))return vfAsk(b.dataset.vf);if(b=t.closest('[data-art]'))return artPicker(b.dataset.art);if(b=t.closest('[data-ap]'))return useArt(b.dataset.ap);if(b=t.closest('[data-pick]'))return pickName(b.dataset.pick);if(b=t.closest('[data-cand]'))return pick(+b.dataset.cand);
  if(b=t.closest('[data-card]'))return showCard(b.dataset.card);if(t.id==='modal')closeM()});

/* ---------- collection ---------- */
const tile=(c,badge='',ctl='')=>`<div class="tile" data-card="${esc(c.name)}"><div class="art">${imgTag(c.name)||`<div class="ph">${esc(c.name)}</div>`}${c.verified?'<span class="vf" title="Artwork verified">✓</span>':''}${badge?`<span class="badge">${badge}</span>`:''}</div><div class="nm">${esc(c.name)}</div>${ctl}</div>`;
function vCollection(m){
  const types=[...new Set(D.cards.map(c=>c.type))].sort(),opt=(v,l)=>`<option ${V[v]===l?'selected':''}>${esc(l)}</option>`;
  m.innerHTML=`<div class="stats"><div><b>${sum(D.cards)}</b>total items</div><div><b>${D.cards.length}</b>unique titles</div><div><b>${sum(D.cards.filter(isReal))}</b>playable cards</div><div><b>${sum(D.cards.filter(c=>c.type==='Token'))}</b>tokens</div></div>
  <div class="bar"><input id="q" type="search" placeholder="Search name or rules text…" value="${esc(V.q)}"><select id="ft"><option value="">All types</option>${types.map(t=>opt('type',t)).join('')}</select><select id="fc"><option value="">All colors</option>${['White','Blue','Black','Red','Green','Colorless','Land'].map(t=>opt('color',t)).join('')}</select></div><div id="list" class="grid"></div>`;
  $('#q').oninput=e=>{V.q=e.target.value;drawList()};$('#ft').onchange=e=>{V.type=e.target.value;drawList()};$('#fc').onchange=e=>{V.color=e.target.value;drawList()};drawList();
}
function drawList(){
  if(V.view!=='collection'||!$('#list'))return;const q=V.q.toLowerCase();
  const cs=D.cards.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.text.toLowerCase().includes(q))&&(!V.type||c.type===V.type)&&(!V.color||c.colors.includes(V.color)));
  $('#list').innerHTML=cs.map(c=>tile(c,'×'+c.qty)).join('')||`<p class="mut">${D.cards.length?'No cards match.':'Your collection is empty. Use the Add card tab to scan or search for your first card, or restore a backup in More → Backup.'}</p>`;
}
function showCard(name){
  const c=findCard(name)||{name,colors:'',type:'',subtype:'',text:'',qty:0,source:'',finish:''},u=usage(c.name),has=v=>v&&v!=='None';
  const acq=D.acq.filter(a=>norm(a.name)===norm(c.name));
  openM(`<div class="cd"><div class="artwrap">${imgTag(c.name,'',true)}${isReal(c)&&findCard(c.name)?(c.verified?`<button class="vfbtn" title="Artwork verified — tap to change" data-vf="${esc(c.name)}">✓</button>`:`<button class="artbtn" title="Change artwork / printing" data-art="${esc(c.name)}">🎨</button>`):''}</div><div><h2>${esc(c.name)}</h2><div class="tags">${[c.type,has(c.subtype)&&c.subtype,c.colors,has(c.cost)&&c.cost,has(c.cmc)&&'MV '+c.cmc,has(c.power)&&`${c.power}/${c.toughness}`].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div>
  ${has(c.text)?`<pre>${esc(c.text)}</pre>`:''}${has(c.keywords)?`<p class="mut">${esc(c.keywords)}</p>`:''}
  <p><b>Owned:</b> ${c.qty} ${has(c.finish)?`<span class="mut">(${esc(c.finish)})</span>`:''}</p>${has(c.legal)&&!/^None/.test(c.legal)?`<p class="warn">${esc(c.legal)}</p>`:''}
  <p><b>Printing:</b> ${c.set?`${esc(c.setName||'')} (${esc(c.set.toUpperCase())}) #${esc(c.cn||'')}${c.verified?' <span style="color:var(--gold)">✓ verified</span>':''}`:'<span class="mut">not set — tap 🎨 to match your physical card</span>'}</p>
  <p><b>Pulled from:</b><br>${esc(c.source||'—').replace(/, /g,'<br>')}</p>
  <p><b>In decks:</b> ${u.length?u.map(x=>`${esc(x.d.name)} ×${x.q}`).join(', '):'none'}</p>
  ${acq.length?`<p><b>Added in app:</b> ${acq.map(a=>`${esc(a.date)} · ${esc(a.source)} ×${a.qty}`).join('; ')}</p>`:''}
  ${isReal(c)?`<button class="pri" data-pd="${esc(c.name)}">Add to a deck…</button>`:''}</div></div>`);
}
function pickDeck(name){PD=name;openM(`<h3>Add “${esc(name)}” to…</h3>${D.decks.map((d,i)=>`<div class="res" onclick="addToDeck(${i},PD,1);closeM()"><span>${esc(d.name)}</span><span class="mut">${sum(d.cards)} cards</span></div>`).join('')||'<p class="mut">No decks yet — create one in the Decks tab.</p>'}`)}

const vfAsk=n=>{if(confirm(`The artwork for ${n} is marked verified ✓.\n\nDo you want to change it?`))artPicker(n)};
let AP={name:'',list:[],q:''};
async function artPicker(name){
  AP={name,list:[],q:''};
  openM(`<button onclick="showCard(AP.name)">← Back</button><h3>Choose artwork for ${esc(name)}</h3><p class="mut">Pick the printing that matches your physical card. Your “pulled from” source stays the same.</p><input type="search" id="apq" placeholder="Filter by set name, code or number…" style="width:100%" oninput="AP.q=this.value;apDraw()"><p id="apst" class="mut">Loading printings…</p><div id="apg" class="grid"></div>`);
  const base=await scry('/cards/named?fuzzy='+encodeURIComponent(front(name)));
  if(!base||base.object!=='card'){if($('#apst'))$('#apst').textContent='No printings found for this card.';return}
  let url=base.prints_search_uri,pages=0;
  while(url&&pages<6&&AP.name===name&&$('#apg')){const p=await scry(url);if(!p?.data)break;AP.list.push(...p.data);pages++;url=p.has_more?p.next_page:null;apDraw(url?' Loading more…':'')}
  apDraw();
}
function apDraw(more=''){
  if(!$('#apg'))return;const cur=findCard(AP.name)?.scryId,q=AP.q.toLowerCase();
  const sm=p=>p.image_uris?.small||p.card_faces?.[0]?.image_uris?.small||'';
  const ls=AP.list.filter(p=>sm(p)&&(!q||`${p.set} ${p.set_name} ${p.collector_number}`.toLowerCase().includes(q)));
  $('#apst').textContent=`${ls.length} of ${AP.list.length} printings${more}`;
  $('#apg').innerHTML=ls.map(p=>`<div class="tile" data-ap="${p.id}"><div class="art"><img loading="lazy" src="${esc(sm(p))}" alt="${esc(p.name)}">${p.id===cur?'<span class="badge">✓</span>':''}</div><div class="nm"><b>${esc(p.set.toUpperCase())}</b> #${esc(p.collector_number)}<br><span class="mut">${esc(p.set_name)}</span></div></div>`).join('');
}
function useArt(id){
  const p=AP.list.find(x=>x.id===id),c=findCard(AP.name);if(!p||!c)return;
  if(!confirm(`Use ${p.set_name} (${p.set.toUpperCase()}) #${p.collector_number} for ${c.name}?\n\nYour “pulled from” source stays the same.`))return;
  Object.assign(c,{art:sImg(p),set:p.set,setName:p.set_name,cn:p.collector_number,scryId:p.id,verified:true});save();render();showCard(c.name);toast('Artwork and set info updated');
}

/* ---------- decks ---------- */
const sleeveOf=d=>D.sleeves.find(s=>s.deck&&s.deck.toLowerCase().startsWith(d.name.toLowerCase()));
const target=d=>d.format==='Commander'?100:d.format==='Casual'?60:0;
function addToDeck(i,name,n){
  const d=D.decks[i],c=findCard(name),used=sum(usage(name)),others=usage(name).filter(x=>x.d!==d);
  if(c&&c.type!=='Basic Land'&&used+n>c.qty){
    if(!confirm(`You own ${c.qty}× ${c.name} and ${used} ${used===1?'is':'are'} already in decks${others.length?' ('+others.map(x=>x.d.name).join(', ')+')':''}.\n\nAdd it to ${d.name} anyway and log it as borrowed?`))return;

OUTPUT FORMAT: one card per line as "<quantity> <card name>", commander first. No headings or bullets. After the list, write a line containing only --- and then a short explanation (under 120 words).

MY COLLECTION (name | type | colors | mana value | copies owned | copies free):
${rows.join('\n')}`}
async function copyPrompt(){const p=buildPrompt();try{await navigator.clipboard.writeText(p);toast('Prompt copied — paste it into your AI')}catch(e){openM(`<h3>Copy this prompt</h3><textarea rows="12" readonly style="width:100%" onfocus="this.select()">${esc(p)}</textarea>`)}}
async function aiGenerate(){
  const key=AIKEY.trim(),model=G.model.trim();if(!key||!model)return toast('Enter a model and your API key first');
  G.busy=true;G.err='';render();const p=buildPrompt();let txt='',r,j;
  try{
    if(G.prov==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:4000,messages:[{role:'user',content:p}]})});j=await r.json();txt=(j.content||[]).map(b=>b.text||'').join('')}
    else if(G.prov==='openai'){r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:p}]})});j=await r.json();txt=j.choices?.[0]?.message?.content||''}
    else{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:p}]}]})});j=await r.json();txt=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
    if(!r.ok)G.err=(j.error?.message||'The provider returned an error ('+r.status+').')+' Check the model name and key.';
  }catch(e){G.err="Couldn't reach the provider — check your connection."}
  G.busy=false;if(txt&&!G.err){G.reply=txt;G.res=null}else if(!G.err)G.err='The AI sent back an empty reply.';
  render();if(G.reply&&!G.err)readReply();
}
function readReply(){
  G.reply=$('#greply')?.value??G.reply;const ents=[],by={};
  G.reply.split(/^\s*---+\s*$/m)[0].split('\n').forEach(l=>{l=l.replace(/^[\s\-•*]+/,'').replace(/^commander:\s*/i,'1 ');const m=l.match(/^(\d+)\s*x?\s+(.+?)\s*$/i);if(!m)return;
    const nm=m[2].replace(/\*+$/,'').trim(),c=findCard(nm),k=norm(nm);if(by[k])return by[k].want+=+m[1];by[k]={name:c?c.name:nm,want:+m[1],c};ents.push(by[k])});
  ents.forEach(e=>{const o=e.c?.qty||0,free=e.c?Math.max(0,o-sum(usage(e.c.name))):0;e.add=Math.min(e.want,o);
    e.st=!e.c?'✗ not in collection (skipped)':e.add<e.want?`⚠ you own only ${o} (using ${e.add})`:e.c.type!=='Basic Land'&&free<e.add?'⚠ borrows from another deck':'✓ available'});
  G.res={ents};drawPrev();
}
function drawPrev(){
  const r=G.res,t=G.fmt==='Commander'?100:60,tot=sum(r.ents,e=>e.add),el=$('#gprev');if(!el)return;
  el.innerHTML=r.ents.length?`<h3>Preview — ${tot}/${t} cards from your collection</h3>${tbl(['Qty','Card','Status'],r.ents.map(e=>[e.add||e.want,{h:cl(e.name)},e.st]))}<div class="f"><label>Deck name</label><input id="gname" value="${esc('AI: '+(G.theme||'New deck').slice(0,32))}"></div><br><button class="pri big" onclick="mkAIDeck()">Create deck from this list</button><p class="mut">Cards you don’t own are skipped. Cards borrowed from other decks are logged in the swap log.</p>`:'<div class="warn">I couldn’t find any “quantity card name” lines in that reply.</div>';
}
function mkAIDeck(){
  const r=G.res,name=($('#gname').value||'AI deck').trim(),f=G.fmt,need=f==='Commander'?100:60,s=D.sleeves.find(x=>!x.deck&&x.total>=need);
  const d={name,format:f,sleeve:s?s.color:'',commander:G.cmd||(f==='Commander'?r.ents[0]?.name||'':''),info:'Built with the AI deck builder',cards:[],tokens:[]};D.decks.push(d);
  if(s){s.deck=`${name} (${f==='Commander'?'Commander - 100 Cards':'Casual - 60 Cards'})`;s.inUse=need}
  r.ents.filter(e=>e.add>0).forEach(e=>{const u=usage(e.c.name).filter(x=>x.d!==d),free=e.c.qty-sum(usage(e.c.name));
    if(e.c.type!=='Basic Land'&&e.add>free)D.swaps.push({deck:name,section:'Added by AI deck builder — borrowed / pulled from other decks',header:['Card Name','Original Owner / Source Deck','Quantity','Date','Notes','Status'],row:[e.c.name,u.map(x=>x.d.name).join(', ')||'Collection',String(e.add-Math.max(0,free)),today(),'Logged automatically','In Deck / Active']});
    d.cards.push({name:e.c.name,qty:e.add,finish:e.c.finish||'Normal'})});
  save();G.res=null;V.view='decks';V.deck=D.decks.length-1;render();scrollTo(0,0);toast('Deck created');
}

  <label>Backup file type</label><select onchange="BKF=this.value"><option value="sqlite" ${BKF==='sqlite'?'selected':''}>SQLite database (.sqlite)</option><option value="json" ${BKF==='json'?'selected':''}>JSON (.json)</option></select>
  <div class="row"><button class="pri" onclick="doBackup(true)">📤 Back up to Drive / Files…</button><button onclick="doBackup(false)">⬇ Download to phone</button></div>
  <p class="mut">The first button opens your phone’s share sheet so you can save the file to Google Drive or Files, or send it to yourself. The .sqlite file opens in any database viewer and can be restored here too.</p>
  <div class="row"><label class="btn">⬆ Restore from a backup file<input type="file" accept=".json,.sqlite,.db,application/json,application/octet-stream" hidden onchange="importData(this.files[0])"></label></div><button class="danger" onclick="resetData()">Reset to starting data</button>`;

const PAL=[['Pink','#ff5fa2'],['Light Pink','#ffc2dd'],['Magenta','#d6249f'],['Purple','#8e44ad'],['Lavender','#b9a3e3'],['Navy','#1b2a6b'],['Blue','#2f6df6'],['Light Blue','#7fc8ff'],['Teal','#1abc9c'],['Mint','#98ffcc'],['Green','#2e9e44'],['Light Green','#9be37a'],['Yellow','#ffd400'],['Gold','#d4af37'],['Orange','#ff8c1a'],['Peach','#ffb38a'],['Red','#e53935'],['Maroon','#800000'],['Brown','#8b5a2b'],['Gray','#7f8c8d'],['Silver','#c0c0c0'],['White','#ffffff'],['Black','#0b0b0b'],['Clear','#dff3f7']];
let SLN=null;
const pickSleeve=i=>{NSV=D.sleeves[i].color;sleeveOpts()};
function slEdit(i){const s=i==null?null:D.sleeves[i];SLN={idx:i,name:s?noEmoji(s.color):'',total:s?s.total:100,hex:s?(s.img?'':(s.hex||SLV[noEmoji(s.color).toLowerCase()]||'')):'#2f6df6',img:s?.img||'',auto:false};slDraw(true)}
function slDraw(open){
  const n=SLN,bg=n.img?`url(${n.img}) center/cover`:(n.hex||'#888'),cv=/^#[0-9a-f]{6}$/i.test(n.hex)?n.hex:'#888888';

function slPick(nm,hx){SLN.hex=hx;SLN.img='';if(nm&&(!SLN.name||SLN.auto)){SLN.name=nm;SLN.auto=true}slDraw()}
let CR=null;
async function slPhoto(file){if(!file)return;try{CR={bmp:await createImageBitmap(file),z:1,ox:0,oy:0};slCrop()}catch(e){toast("Couldn't read that photo")}}
function slCrop(){
  $('#mbody').innerHTML=`<h3>Crop your sleeve</h3><p class="mut">Drag the photo to line the sleeve up inside the circle, and use the slider to zoom. Only the circle is saved.</p><canvas id="crv" width="300" height="300" style="width:100%;max-width:340px;display:block;margin:auto;touch-action:none;border-radius:12px;background:#000"></canvas><label>Zoom</label><input type="range" min="1" max="4" step="0.02" value="${CR.z}" style="width:100%" oninput="CR.z=+this.value;crDraw()"><div class="row"><button onclick="slDraw()">Cancel</button><button onclick="CR.z=1;CR.ox=CR.oy=0;slCrop()">Re-center</button><button class="pri" onclick="crSave()">Use this crop</button></div>`;
  const c=$('#crv');let last=null;
  c.onpointerdown=e=>{last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!last)return;const k=300/c.getBoundingClientRect().width;CR.ox+=(e.clientX-last[0])*k;CR.oy+=(e.clientY-last[1])*k;last=[e.clientX,e.clientY];crDraw()};
  c.onpointerup=c.onpointercancel=()=>{last=null};crDraw();
}
function crGeom(){const b=CR.bmp,s=300/Math.min(b.width,b.height)*CR.z,w=b.width*s,hh=b.height*s;
  CR.ox=Math.max(-(w-300)/2,Math.min((w-300)/2,CR.ox));CR.oy=Math.max(-(hh-300)/2,Math.min((hh-300)/2,CR.oy));return {s,w,h:hh,px:150-w/2+CR.ox,py:150-hh/2+CR.oy}}
function crDraw(){const c=$('#crv');if(!c)return;const x=c.getContext('2d'),g=crGeom();x.clearRect(0,0,300,300);x.drawImage(CR.bmp,g.px,g.py,g.w,g.h);
  x.fillStyle='rgba(0,0,0,.6)';x.beginPath();x.rect(0,0,300,300);x.arc(150,150,140,0,7,true);x.fill('evenodd');x.strokeStyle='#f1c40f';x.lineWidth=2;x.beginPath();x.arc(150,150,140,0,7);x.stroke()}
function crSave(){const g=crGeom(),cv=document.createElement('canvas');cv.width=cv.height=160;
  cv.getContext('2d').drawImage(CR.bmp,(10-g.px)/g.s,(10-g.py)/g.s,280/g.s,280/g.s,0,0,160,160);SLN.img=cv.toDataURL('image/jpeg',.8);SLN.hex='';CR=null;slDraw()}
function slSave(){const n=SLN,name=n.name.trim();if(!name)return toast('Give the sleeves a name');
  if(D.sleeves.some((s,i)=>i!==n.idx&&noEmoji(s.color).toLowerCase()===name.toLowerCase()))return toast('You already have sleeves with that name');

const stamp=()=>{try{localStorage.setItem(BK,today());localStorage.removeItem(DY)}catch(e){}};
async function checkPersist(){let p=false;try{p=await navigator.storage.persisted()}catch(e){}const el=$('#pst');if(el)el.textContent=p?'protected ✓':'not guaranteed — back up regularly'}
function backupDue(){try{if(!localStorage.getItem(DY))return '';const l=localStorage.getItem(BK);if(!l)return 'You have changes that have never been backed up.';const d=Math.floor((Date.now()-new Date(l))/864e5);return d>=14?`Your last backup was ${d} days ago.`:''}catch(e){return ''}}
let SQLP=null;const SQLB='https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/';
const loadSQL=()=>SQLP||(SQLP=new Promise((ok,no)=>{const s=document.createElement('script');s.src=SQLB+'sql-wasm.js';s.onload=()=>initSqlJs({locateFile:f=>SQLB+f}).then(ok,e=>{SQLP=null;no(e)});s.onerror=()=>{SQLP=null;no()};document.head.appendChild(s)}));
async function sqliteBytes(){
  const SQL=await loadSQL(),db=new SQL.Database();
  db.exec(`CREATE TABLE app_state(key TEXT PRIMARY KEY,value TEXT);
  CREATE TABLE cards(name TEXT,pull_sources TEXT,color_identity TEXT,mana_cost TEXT,mana_value REAL,card_type TEXT,subtype TEXT,power TEXT,toughness TEXT,rules_text TEXT,keywords TEXT,restrictions TEXT,quantity_owned INTEGER,finish TEXT,set_code TEXT,set_name TEXT,collector_number TEXT,scryfall_id TEXT,art_url TEXT,art_verified INTEGER);
  CREATE TABLE decks(id INTEGER PRIMARY KEY,name TEXT,format TEXT,commander TEXT,sleeve TEXT);
  CREATE TABLE deck_cards(deck_id INTEGER,card_name TEXT,quantity INTEGER,finish TEXT,is_token INTEGER);
  CREATE TABLE acquisitions(date TEXT,card_name TEXT,set_code TEXT,collector_number TEXT,finish TEXT,quantity INTEGER,source TEXT,price TEXT,notes TEXT);
  CREATE TABLE swap_log(deck TEXT,section TEXT,card TEXT,from_to TEXT,quantity TEXT,date TEXT,notes TEXT,status TEXT);
  CREATE TABLE sleeves(color TEXT,total INTEGER,assigned_deck TEXT,in_use INTEGER);`);
  const ins=(t,rows)=>{if(!rows.length)return;const st=db.prepare(`INSERT INTO ${t} VALUES(${rows[0].map(()=>'?').join(',')})`);rows.forEach(r=>st.run(r.map(v=>v??'')));st.free()};
  ins('app_state',[['backup_json',JSON.stringify(D)],['exported',new Date().toISOString()]]);
  ins('cards',D.cards.map(c=>[c.name,c.source,c.colors,c.cost,+c.cmc||0,c.type,c.subtype,c.power,c.toughness,c.text,c.keywords,c.legal,c.qty,c.finish,c.set,c.setName,c.cn,c.scryId,c.art,c.verified?1:0]));
  ins('decks',D.decks.map((d,i)=>[i+1,d.name,d.format,d.commander,noEmoji(sleeveOf(d)?.color||d.sleeve||'')]));
  ins('deck_cards',D.decks.flatMap((d,i)=>[...d.cards.map(c=>[i+1,c.name,c.qty,c.finish,0]),...d.tokens.map(c=>[i+1,c.name,c.qty,c.finish,1])]));
  ins('acquisitions',D.acq.map(a=>[a.date,a.name,a.set,a.cn,a.finish,a.qty,a.source,a.price,a.notes]));
  ins('swap_log',D.swaps.map(s=>[s.deck,s.section,...s.row]));
  ins('sleeves',D.sleeves.map(s=>[noEmoji(s.color),s.total,noEmoji(s.deck||''),s.inUse]));
  const out=db.export();db.close();return out;
}
async function doBackup(share){
  const ext=BKF==='json'?'json':'sqlite',name=`mtg-collection-${today()}.${ext}`;let blob;
  try{blob=BKF==='json'?new Blob([JSON.stringify(D)],{type:'application/json'}):new Blob([await sqliteBytes()],{type:'application/octet-stream'})}
  catch(e){return toast('The .sqlite export needs internet the first time — reconnect, or choose JSON')}
  const f=new File([blob],name,{type:blob.type});
  if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'MTG collection backup'});stamp();toast('Backup shared');return render()}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();stamp();
  toast(share?'Your phone’s share sheet didn’t accept this file, so it was saved to Downloads — send it to Drive from the Files app':'Saved to Downloads');render();
}
async function importData(f){
  if(!f)return;
  try{const buf=new Uint8Array(await f.arrayBuffer());let j;
    if(String.fromCharCode(...buf.slice(0,15))==='SQLite format 3'){const SQL=await loadSQL(),db=new SQL.Database(buf),r=db.exec("SELECT value FROM app_state WHERE key='backup_json'");db.close();j=JSON.parse(r[0].values[0][0])}
    else j=JSON.parse(new TextDecoder().decode(buf));
    if(!j.cards||!j.decks)throw 0;
    if(!confirm(`Restore this backup? It replaces everything currently in the app (${D.cards.length} cards, ${D.decks.length} decks).`))return;
    D=j;D.acq=D.acq||[];save();stamp();toast('Backup restored');render();fetchArt()}
  catch(e){toast('That file is not a valid backup')}
}
async function startData(){try{const r=await fetch('data.json',{cache:'reload'});if(r.ok)return await r.json()}catch(e){}return JSON.parse(JSON.stringify(EMPTY))}
async function resetData(){if(!confirm('Replace everything with the starting data (a blank collection if the app has no starting data file)? Changes made in the app will be lost — back up first.'))return;
  D=await startData();D.acq=[];save();render();fetchArt();toast('Reset complete')}
