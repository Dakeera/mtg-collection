<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS='';const LS='mtg_state_v1'+NS,AS='mtg_art_v1'+NS,BK='mtg_backup_v1'+NS,DY='mtg_dirty_v1'+NS;const EMPTY={cards:[],decks:[],swaps:[],matchups:[],sleeves:['Pink','Purple','Light Pink','Light Blue','Blue','Red','Light Green','Green','Yellow','Orange','White','Black'].map(color=>({color,total:0,deck:'',inUse:0}))};
let IDX=null,D,A={step:'start'},PD='',ART={},ART2={},FACE=false;try{ART=JSON.parse(localStorage.getItem(AS)||'{}')}catch(e){}try{ART2=JSON.parse(localStorage.getItem(AS+'_b')||'{}')}catch(e){}
const V={view:'collection',q:'',type:'',color:'',deck:null,sub:'log'};

const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,''),front=s=>String(s).split(' // ')[0];
const p2=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`},tsName=()=>{const d=new Date();return `${String(d.getFullYear()).slice(2)}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`},sum=(a,f=x=>x.qty)=>a.reduce((s,x)=>s+f(x),0);
const isReal=c=>!['Token','Accessory'].includes(c.type);

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
let MBACK=null,SLD=false,KEEPSCROLL=false;

const imgErr=i=>{if(i.src.includes('/large/')){i.src=i.src.replace('/large/','/normal/');return}if(i.crossOrigin){i.removeAttribute('crossorigin');i.src=i.src}else i.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:i.alt}))};
const artOf=n=>{const c=findCard(n);return (c&&c.art)||ART[n]||''};
const imgTag=(n,cls='',big)=>{let u=artOf(n);if(!u)return '';if(big)u=u.replace('/normal/','/large/');return `<img ${cls} loading="lazy" crossorigin="anonymous" src="${esc(u)}" alt="${esc(n)}" onerror="imgErr(this)">`};

const SLV={pink:'#ff5fa2','light pink':'#ffc2dd',purple:'#8e44ad',red:'#e53935','light blue':'#7fc8ff',blue:'#2f6df6','light green':'#9be37a',green:'#2e9e44',yellow:'#ffd400',orange:'#ff8c1a',white:'#ffffff',black:'#0b0b0b'};

/* ---------- decks ---------- */
/* Loans: a card physically moved from one deck to another. It stays on both lists; the lender is flagged incomplete (red ★) until it is returned or the loan is made permanent. */
const actLoans=()=>((D&&D.loans)||[]).filter(l=>l.status==='active');
const loanedOut=(deck,card)=>sum(actLoans().filter(l=>l.from===deck&&(card==null||norm(l.card)===norm(card))),l=>l.qty);
const loanedIn=(deck,card)=>sum(actLoans().filter(l=>l.to===deck&&(card==null||norm(l.card)===norm(card))),l=>l.qty);
const physInDecks=name=>sum(usage(name))-sum(actLoans().filter(l=>norm(l.card)===norm(name)),l=>l.qty);
const freeCopies=c=>c.type==='Basic Land'?c.qty:Math.max(0,c.qty-physInDecks(c.name));
const takeable=(c,deck)=>c.type==='Basic Land'?0:Math.max(0,sum(usage(c.name).filter(x=>x.d.name===deck),x=>x.q)-loanedOut(deck,c.name));
function planCard(c,want,allowed){const fr=Math.min(want,freeCopies(c));let left=want-fr;const from=[];
  allowed.map(n=>({n,t:takeable(c,n)})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t).forEach(x=>{if(left<=0)return;const k=Math.min(left,x.t);from.push({deck:x.n,q:k});left-=k});
  return {free:fr,from,short:left,got:want-left}}
function makeLoan(card,qty,from,to,section,note){const id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  D.loans.push({id,card,qty,from,to,date:today(),status:'active'});
  D.swaps.push({deck:to,loan:id,section:section||'Added in app — borrowed / pulled from other decks',header:['Card Name','Original Owner / Source Deck','Quantity','Date','Notes','Status'],row:[card,from,String(qty),today(),note||('Logged automatically — '+from+' is missing this card until it is returned'),'In Deck / Active']});return id}
const setSwapStatus=(id,t)=>D.swaps.forEach(w=>{if(w.loan===id&&w.row)w.row[5]=t});
function reconcileLoans(){if(!D||!D.loans)return;const run={};
  D.loans.filter(l=>l.status==='active').forEach(l=>{const to=D.decks.find(d=>d.name===l.to),fr=D.decks.find(d=>d.name===l.from);
    if(!to||!fr){l.status='closed';l.done=today();setSwapStatus(l.id,'Closed (a deck was deleted)');return}
    const k=l.to+'|'+norm(l.card);run[k]=(run[k]||0)+l.qty;const have=sum(to.cards.filter(x=>norm(x.name)===norm(l.card)));
    if(have<run[k]){run[k]-=l.qty;l.status='returned';l.done=today();l.auto=true;setSwapStatus(l.id,'Returned '+today()+' (removed from '+l.to+')')}})}
function returnLoan(id){if(fxDraftDirty())return toast('Save or discard your deck changes first');const l=D.loans.find(x=>x.id===id&&x.status==='active');if(!l)return;
  if(!confirm(`Take ${l.qty}× ${l.card} back to ${l.from}?\n\nIt will be removed from ${l.to}, which will then be missing it.`))return;
  const to=D.decks.find(d=>d.name===l.to),e=to&&to.cards.find(x=>norm(x.name)===norm(l.card));if(e){e.qty-=l.qty;if(e.qty<=0)to.cards.splice(to.cards.indexOf(e),1)}
  l.status='returned';l.done=today();setSwapStatus(id,'Returned '+today());save();render();toast(`${l.card} is back in ${l.from}`)}
function keepLoan(id){if(fxDraftDirty())return toast('Save or discard your deck changes first');const l=D.loans.find(x=>x.id===id&&x.status==='active');if(!l)return;
  if(!confirm(`Make it permanent?\n\n${l.qty}× ${l.card} stays in ${l.to} and is taken off ${l.from}'s list, so ${l.from} is no longer flagged for it.`))return;
  const fr=D.decks.find(d=>d.name===l.from),e=fr&&fr.cards.find(x=>norm(x.name)===norm(l.card));if(e){e.qty-=l.qty;if(e.qty<=0)fr.cards.splice(fr.cards.indexOf(e),1)}
  l.status='permanent';l.done=today();setSwapStatus(id,'Permanent '+today());save();render();toast(`${l.card} now belongs to ${l.to}`)}
function whyIncomplete(d){const r=[],lo=loanedOut(d.name),t=target(d),n=sum(d.cards);if(lo)r.push(`${lo} card${lo>1?'s':''} loaned out`);
  const tb=sum((D.loans||[]).filter(l=>l.status==='returned'&&l.to===d.name),l=>l.qty);if(tb&&t&&n<t)r.push(`${t-n} short after cards were taken back`);return r}
function loanBox(d){const out=actLoans().filter(l=>l.from===d.name),inn=actLoans().filter(l=>l.to===d.name),why=whyIncomplete(d);let h='';

  else if(why.length)h+=`<div class="redbox"><b class="star">★ Incomplete — ${esc(why.join('; '))}</b></div>`;
  if(inn.length)h+=`<div class="sec"><h4>Borrowed from other decks</h4>${inn.map(l=>`<div class="kv"><span>${cl(l.card)} ×${l.qty} ← ${esc(l.from)}</span><b><button onclick="returnLoan('${l.id}')">Return</button> <button onclick="keepLoan('${l.id}')">Keep</button></b></div>`).join('')}</div>`;

const sleeveOf=d=>D.sleeves.find(s=>s.deck&&s.deck.toLowerCase().startsWith(d.name.toLowerCase()));

  toast('Reverted to '+autoWhen(name));render();fetchArt()}

/* ---------- back button (shared logic; Android uses @capacitor/app, the web version uses the browser history) ---------- */
async function appVersion(){let v='web version';try{if(isNative()){const i=await window.Capacitor.Plugins.App.getInfo();v='Android app version '+i.version+' (build '+i.build+')'}}catch(e){}const e=$('#ver');if(e)e.textContent='MtG DeckMaster · '+v}
function topBtn(){const b=$('#totop');if(!b)return;const t=document.querySelector('#main .tile'),h=t?t.offsetHeight:400;b.style.display=scrollY>h?'block':'none'}
addEventListener('scroll',topBtn,{passive:true});
let HIST=[],EXIT_T=0,LEAVING=false;
const DISCARD='Discard your changes?\n\nOK = discard them\nCancel = keep editing';
function modalDirty(){return !!((SLD&&SLN&&JSON.stringify(SLN)!==SLN0)||CR||($('#nd')&&$('#nd').value.trim()))}
function tryClose(){if(modalDirty()&&!confirm(DISCARD))return false;closeM();return true}
function navBack(){
  if(fxBack())return true;
  const ap=$('#apfull');if(ap){ap.remove();return true}
  const z=$('#zoom');if(z){z.remove();return true}
  if($('#modal').classList.contains('open')){if(modalDirty()&&!confirm(DISCARD))return true;if(MBACK){const b=MBACK;MBACK=null;b()}else closeM();return true}
  if(V.view==='add'){
    if(A.step==='done'||A.step==='reading'||A.step==='fail'){A={step:'start'};render();return true}
    if(A.step!=='start'){if(!confirm('Leave this card without adding it?\n\nOK = discard what you entered\nCancel = keep going'))return true;A={step:'start'};render();return true}}
  if(V.view==='decks'&&V.deck!=null){fxLeaveDeck();return true}
  if(V.view!=='collection'){SCR[V.view]=scrollY;showTab(HIST.length?HIST.pop():'collection');return true}
  if(RO){roExit();return true}
  if(Date.now()-EXIT_T<2500)return 'exit';
  EXIT_T=Date.now();toast('To close the app, hit the back button again');return true}
(function(){
  if(isNative()){document.documentElement.classList.add('native');
    const CApp=window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
    if(CApp&&CApp.addListener)CApp.addListener('backButton',()=>{if(navBack()==='exit'){try{CApp.exitApp()}catch(e){}}})}
  else{try{let ARM=false;const arm=()=>{if(!ARM){try{history.pushState({mtg:1},'');ARM=true}catch(e){}}};
    history.replaceState({mtg:0},'');addEventListener('pointerdown',arm,{passive:true});addEventListener('keydown',arm);
    addEventListener('popstate',()=>{if(LEAVING)return;ARM=false;const r=navBack();if(r==='exit'){LEAVING=true;history.back();return}arm()})}catch(e){}}
})();
init();
</script></body></html>
