/* Loans: a card physically moved from one deck to another. It stays on both lists; the lender is flagged incomplete (red ★) until it is returned or the loan is made permanent. */
const actLoans=()=>((D&&D.loans)||[]).filter(l=>l.status==='active');
const loanedOut=(deck,card)=>sum(actLoans().filter(l=>l.from===deck&&(card==null||norm(l.card)===norm(card))),l=>l.qty);
const loanedIn=(deck,card)=>sum(actLoans().filter(l=>l.to===deck&&(card==null||norm(l.card)===norm(card))),l=>l.qty);
const physInDecks=name=>sum(usage(name))-sum(actLoans().filter(l=>norm(l.card)===norm(name)),l=>l.qty);
const freeCopies=c=>c.type==='Basic Land'?c.qty:Math.max(0,c.qty-physInDecks(c.name));
const takeable=(c,deck)=>c.type==='Basic Land'?0:Math.max(0,sum(usage(c.name).filter(x=>x.d.name===deck),x=>x.q)-loanedOut(deck,c.name));
function planCard(c,want,allowed){const fr=Math.min(want,freeCopies(c));let left=want-fr;const from=[];
  allowed.map(n=>({n,t:takeable(c,n)})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t).forEach(x=>{if(left<=0)return;const k=Math.min(left,x.t);from.push({deck:x.n,q:k});left-=k});
  return {free:fr,from,short:left,got:want-left}}
function makeLoan(card,qty,from,to,section,note){const id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  D.loans.push({id,card,qty,from,to,date:today(),status:'active'});
  D.swaps.push({deck:to,loan:id,section:section||'Added in app — borrowed / pulled from other decks',header:['Card Name','Original Owner / Source Deck','Quantity','Date','Notes','Status'],row:[card,from,String(qty),today(),note||('Logged automatically — '+from+' is missing this card until it is returned'),'In Deck / Active']});return id}
const setSwapStatus=(id,t)=>D.swaps.forEach(w=>{if(w.loan===id&&w.row)w.row[5]=t});
function reconcileLoans(){if(!D||!D.loans)return;const run={};
  D.loans.filter(l=>l.status==='active').forEach(l=>{const to=D.decks.find(d=>d.name===l.to),fr=D.decks.find(d=>d.name===l.from);
    if(!to||!fr){l.status='closed';l.done=today();setSwapStatus(l.id,'Closed (a deck was deleted)');return}
    const k=l.to+'|'+norm(l.card);run[k]=(run[k]||0)+l.qty;const have=sum(to.cards.filter(x=>norm(x.name)===norm(l.card)));
    if(have<run[k]){run[k]-=l.qty;l.status='returned';l.done=today();l.auto=true;setSwapStatus(l.id,'Returned '+today()+' (removed from '+l.to+')')}})}
async function returnLoan(id){if(fxDraftDirty())return toast('Save or discard your deck changes first');const l=D.loans.find(x=>x.id===id&&x.status==='active');if(!l)return;

async function keepLoan(id){if(fxDraftDirty())return toast('Save or discard your deck changes first');const l=D.loans.find(x=>x.id===id&&x.status==='active');if(!l)return;

  $('#mbody').innerHTML=`<h3>Crop your sleeve</h3><p class="mut">Drag the photo to line the sleeve up inside the circle, and use the slider to zoom. Only the circle is saved.</p><canvas id="crv" width="300" height="300" style="width:100%;max-width:340px;display:block;margin:auto;touch-action:none;border-radius:12px;background:#000"></canvas><label>Zoom</label><input type="range" min="1" max="4" step="0.02" value="${CR.z}" style="width:100%" oninput="CR.z=+this.value;crDraw()"><div class="row"><button onclick="slDraw()">Cancel</button><button onclick="CR.z=1;CR.ox=CR.oy=0;slCrop()">Re-center</button><button class="pri" onclick="crSave()">Use this crop</button></div>`;
  const c=$('#crv');let last=null;
  c.onpointerdown=e=>{last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!last)return;const k=300/c.getBoundingClientRect().width;CR.ox+=(e.clientX-last[0])*k;CR.oy+=(e.clientY-last[1])*k;last=[e.clientX,e.clientY];crDraw()};
  c.onpointerup=c.onpointercancel=()=>{last=null};crDraw();
}
function crGeom(){const b=CR.bmp,s=300/Math.min(b.width,b.height)*CR.z,w=b.width*s,hh=b.height*s;
  CR.ox=Math.max(-(w-300)/2,Math.min((w-300)/2,CR.ox));CR.oy=Math.max(-(hh-300)/2,Math.min((hh-300)/2,CR.oy));return {s,w,h:hh,px:150-w/2+CR.ox,py:150-hh/2+CR.oy}}
function crDraw(){const c=$('#crv');if(!c)return;const x=c.getContext('2d'),g=crGeom();x.clearRect(0,0,300,300);x.drawImage(CR.bmp,g.px,g.py,g.w,g.h);
  x.fillStyle='rgba(0,0,0,.6)';x.beginPath();x.rect(0,0,300,300);x.moveTo(290,150);x.arc(150,150,140,0,Math.PI*2,true);x.closePath();x.fill('evenodd');x.strokeStyle='#f1c40f';x.lineWidth=2;x.beginPath();x.arc(150,150,140,0,Math.PI*2);x.stroke()}
function crSave(){const g=crGeom(),cv=document.createElement('canvas');cv.width=cv.height=160;
  cv.getContext('2d').drawImage(CR.bmp,(10-g.px)/g.s,(10-g.py)/g.s,280/g.s,280/g.s,0,0,160,160);SLN.img=cv.toDataURL('image/jpeg',.8);SLN.hex='';CR=null;slDraw()}
async function slSave(){const n=SLN,name=n.name.trim();if(!name)return toast('Give the sleeves a name');if(!(await ask(n.idx==null?`Add the sleeves “${name}” (${n.total})?`:`Save the changes to the sleeves “${name}”?`)))return;
  if(D.sleeves.some((s,i)=>i!==n.idx&&noEmoji(s.color).toLowerCase()===name.toLowerCase()))return toast('You already have sleeves with that name');
  if(n.idx==null)D.sleeves.push({color:name,total:n.total,deck:'',inUse:0,hex:n.hex,img:n.img});else Object.assign(D.sleeves[n.idx],{color:name,total:n.total,hex:n.hex,img:n.img});
  save();closeM();render();toast('Sleeves saved')}
async function slDel(i){const s=D.sleeves[i];if(s.deck)return toast('Those sleeves are assigned to a deck — free them first');if(await ask(`Remove ${noEmoji(s.color)} sleeves from your inventory?`)){D.sleeves.splice(i,1);save();render()}}

function backupDue(){try{if(!localStorage.getItem(DY))return '';const l=localStorage.getItem(BK);if(!l)return 'You have changes that have never been backed up.';const d=Math.floor((Date.now()-new Date(l))/864e5);return d>=14?`Your last backup was ${d} days ago.`:''}catch(e){return ''}}
let SQLP=null;const SQLB='https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/';
const loadSQL=()=>SQLP||(SQLP=new Promise((ok,no)=>{const s=document.createElement('script');s.src=SQLB+'sql-wasm.js';s.onload=()=>initSqlJs({locateFile:f=>SQLB+f}).then(ok,e=>{SQLP=null;no(e)});s.onerror=()=>{SQLP=null;no()};document.head.appendChild(s)}));
async function sqliteBytes(){
  const SQL=await loadSQL(),db=new SQL.Database();
  db.exec(`CREATE TABLE app_state(key TEXT PRIMARY KEY,value TEXT);
  CREATE TABLE cards(name TEXT,pull_sources TEXT,color_identity TEXT,mana_cost TEXT,mana_value REAL,card_type TEXT,subtype TEXT,power TEXT,toughness TEXT,rules_text TEXT,keywords TEXT,restrictions TEXT,quantity_owned INTEGER,finish TEXT,set_code TEXT,set_name TEXT,collector_number TEXT,scryfall_id TEXT,art_url TEXT,art_verified INTEGER);
  CREATE TABLE decks(id INTEGER PRIMARY KEY,name TEXT,format TEXT,commander TEXT,sleeve TEXT);
  CREATE TABLE deck_cards(deck_id INTEGER,card_name TEXT,quantity INTEGER,finish TEXT,is_token INTEGER);
  CREATE TABLE acquisitions(date TEXT,card_name TEXT,set_code TEXT,collector_number TEXT,finish TEXT,quantity INTEGER,source TEXT,price TEXT,notes TEXT);
  CREATE TABLE swap_log(deck TEXT,section TEXT,card TEXT,from_to TEXT,quantity TEXT,date TEXT,notes TEXT,status TEXT);
  CREATE TABLE sleeves(color TEXT,total INTEGER,assigned_deck TEXT,in_use INTEGER);`);
  const ins=(t,rows)=>{if(!rows.length)return;const st=db.prepare(`INSERT INTO ${t} VALUES(${rows[0].map(()=>'?').join(',')})`);rows.forEach(r=>st.run(r.map(v=>v??'')));st.free()};
  ins('app_state',[['backup_json',fxWithImgs(D,FXBKKEYS)],['exported',new Date().toISOString()]]);
  ins('cards',D.cards.map(c=>[c.name,c.source,c.colors,c.cost,+c.cmc||0,c.type,c.subtype,c.power,c.toughness,c.text,c.keywords,c.legal,c.qty,c.finish,c.set,c.setName,c.cn,c.scryId,c.art,c.verified?1:0]));
  ins('decks',D.decks.map((d,i)=>[i+1,d.name,d.format,d.commander,noEmoji(sleeveOf(d)?.color||d.sleeve||'')]));
  ins('deck_cards',D.decks.flatMap((d,i)=>[...d.cards.map(c=>[i+1,c.name,c.qty,c.finish,0]),...d.tokens.map(c=>[i+1,c.name,c.qty,c.finish,1])]));
  ins('acquisitions',D.acq.map(a=>[a.date,a.name,a.set,a.cn,a.finish,a.qty,a.source,a.price,a.notes]));
  ins('swap_log',D.swaps.map(s=>[s.deck,s.section,...s.row]));
  ins('sleeves',D.sleeves.map(s=>[noEmoji(s.color),s.total,noEmoji(s.deck||''),s.inUse]));
  const out=db.export();db.close();return out;
}
const isNative=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const blobB64=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(b)});
// Android app: the built-in browser can't download or use the web share sheet, so use the native file + share plugins.
async function nativeSave(blob,name,share){
  const P=window.Capacitor.Plugins;if(!P||!P.Filesystem)throw new Error('The phone file tools are missing from this app build.');
  const data=await blobB64(blob);
  if(!share){try{const r=await P.Filesystem.writeFile({path:'MtG-DeckMaster/'+name,data,directory:'DOCUMENTS',recursive:true});return {where:'Documents/MtG-DeckMaster/'+name,uri:r.uri}}catch(e){}}
  if(!P.Share)throw new Error('The share tool is missing from this app build.');
  const r=await P.Filesystem.writeFile({path:name,data,directory:'CACHE'});
  try{await P.Share.share({title:'MtG DeckMaster backup',files:[r.uri],dialogTitle:'Save your backup'})}
  catch(e){if(/cancel/i.test(String(e&&e.message||e)))return {cancelled:true};throw e}
  return {shared:true,fellBack:!share};
}
async function doBackup(share,keys){
  /* API keys: Yes (include) / No (leave out) / Cancel (no backup) */
  if(keys===undefined&&fxKeyAny())return fxAsk('Include your API key'+(Object.keys(fxKeys0()).length>1?'s':'')+'?',`<p>You have a saved API key (${esc(fxKeyList())}).</p><p class="mut"><b>Yes</b> — include it, so restoring this backup on a new device brings it back.<br><b>No</b> — leave it out (safer if you’ll store or send the file somewhere others can see).<br><b>Cancel</b> — don’t make a backup.</p>`,[{t:'Yes',cls:'pri',fn:()=>doBackup(share,true)},{t:'No',fn:()=>doBackup(share,false)},{t:'Cancel'}]);
  FXBKKEYS=!!keys;
  const ext=BKF==='json'?'json':'sqlite',name=`${fxPrefix()}backup_${tsName()}.${ext}`;let blob;
  try{blob=BKF==='json'?new Blob([fxWithImgs(D,FXBKKEYS)],{type:'application/json'}):new Blob([await sqliteBytes()],{type:'application/octet-stream'})}
  catch(e){return toast('The .sqlite export needs internet the first time — reconnect, or choose JSON')}
  if(isNative()){
    try{const r=await nativeSave(blob,name,share);
      if(r.cancelled)return toast('Backup cancelled — nothing was saved');
      stamp();toast(r.where?'Saved to '+r.where:r.fellBack?'Couldn’t save straight to the phone, so pick where to save it from the list':'Backup shared');return render()}
    catch(e){return toast('Backup failed: '+String(e&&e.message||e).slice(0,90))}
  }
  const f=new File([blob],name,{type:blob.type});
  if(share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'MTG collection backup'});stamp();toast('Backup shared');return render()}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();stamp();
  toast(share?'Your phone’s share sheet didn’t accept this file, so it was saved to Downloads — send it to Drive from the Files app':'Saved to Downloads');render();
}
async function importData(f){return fxOpenFile(f,'restore')}
async function startData(){try{const r=await fetch('data.json',{cache:'reload'});if(r.ok)return await r.json()}catch(e){}return JSON.parse(JSON.stringify(EMPTY))}
async function resetData(){if(!(await ask('Erase your whole collection, decks and logs on this device?\n\nThis can’t be undone — make a backup first if you might want them back. (Saved API keys and other people’s collections are kept.)')))return;if(!(await ask('Are you sure???\n\nEverything in this collection will be erased.')))return;
  D=await startData();D.acq=[];D.loans=[];save();render();fetchArt();toast('Everything on this device was erased')}
/* ---------- automatic backups (off by default; keeps the newest 5; separate from manual backups) ---------- */
/* Android app: JSON files in Documents/MtG-DeckMaster/autosave. Web version: the browser can't write to a folder, so the same 5 copies live in the browser's own storage (IndexedDB). JSON is used because it is smaller than .sqlite. */
const AUTO_KEY='mtg_auto_v1'+NS,AUTO_DIR='MtG-DeckMaster/autosave',AUTO_KEEP=5,AUTO_RE=/^auto-\d{6}-\d{6}\.json$/;
const autoOn=()=>{try{return localStorage.getItem(AUTO_KEY)==='1'}catch(e){return false}};
let AUTO_T=null,AUTO_LAST='',AUTO_BUSY=false,AUTO_PAUSE=false,AUTO_ERR=false,AUTO_LIST=null;
const idbOpen=()=>new Promise((ok,no)=>{const r=indexedDB.open('mtg_auto',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'name'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbRun=(mode,fn)=>idbOpen().then(db=>new Promise((ok,no)=>{const t=db.transaction('f',mode),r=fn(t.objectStore('f'));t.oncomplete=()=>{db.close();ok(r&&r.result)};t.onerror=()=>no(t.error)}));
const FS=()=>window.Capacitor.Plugins.Filesystem;
async function autoNames(){let n;
  if(isNative()){const r=await FS().readdir({path:AUTO_DIR,directory:'DOCUMENTS'}).catch(()=>({files:[]}));n=(r.files||[]).map(f=>f.name||f)}
  else n=await idbRun('readonly',st=>st.getAllKeys());
  return (n||[]).filter(x=>AUTO_RE.test(x)).sort().reverse()}
async function autoPut(name,text){if(isNative())await FS().writeFile({path:AUTO_DIR+'/'+name,data:text,directory:'DOCUMENTS',encoding:'utf8',recursive:true});else await idbRun('readwrite',st=>st.put({name,text}))}
async function autoGet(name){if(isNative())return (await FS().readFile({path:AUTO_DIR+'/'+name,directory:'DOCUMENTS',encoding:'utf8'})).data;
  const r=await idbRun('readonly',st=>st.get(name));return r&&r.text}
async function autoDel(name){if(isNative())await FS().deleteFile({path:AUTO_DIR+'/'+name,directory:'DOCUMENTS'});else await idbRun('readwrite',st=>st.delete(name))}
function autoSchedule(){if(!autoOn()||AUTO_PAUSE||typeof D==='undefined'||!D)return;clearTimeout(AUTO_T);AUTO_T=setTimeout(autoRun,2000)}
async function autoRun(){AUTO_T=null;if(!autoOn()||AUTO_PAUSE)return;if(AUTO_BUSY)return autoSchedule();
  const txt=JSON.stringify(D);if(txt===AUTO_LAST)return;AUTO_BUSY=true;
  try{const d=new Date(),name=`auto-${tsName()}${p2(d.getSeconds())}.json`;await autoPut(name,fxWithImgs(D,true));AUTO_LAST=txt;
    for(const old of (await autoNames()).slice(AUTO_KEEP))await autoDel(old);AUTO_ERR=false;autoRefresh()}
  catch(e){if(!AUTO_ERR)toast('Auto-backup failed: '+String(e&&e.message||e).slice(0,80));AUTO_ERR=true}
  AUTO_BUSY=false}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AUTO_T){clearTimeout(AUTO_T);autoRun()}});
async function autoSet(on){if(!on&&!(await ask('Turn off automatic backups?\n\nChanges will no longer be saved automatically. Your existing auto-backup files stay in the list and can still be used to revert.\n\nOK = turn off\nCancel = keep it on'))){render();return}try{localStorage.setItem(AUTO_KEY,on?'1':'0')}catch(e){return toast('Could not save that setting')}
  AUTO_LAST='';if(on)autoRun().then(()=>toast('Automatic backups are on'));else toast('Automatic backups are off — existing auto-backup files are kept');render()}
const autoWhen=n=>{const m=n.match(/^auto-(\d\d)(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/);return m?new Date(2000+ +m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}):n};
function autoBox(){return `<h3>Automatic backups</h3><p class="mut">Saves a fresh copy every time something changes, and keeps only the newest ${AUTO_KEEP} so you can step back if a change was a mistake. Your manual backups above are never touched. ${isNative()?'Files go in <b>Documents/MtG-DeckMaster/autosave</b> on this phone.':'On the web version they are kept inside this browser’s storage (a web page can’t write to a folder).'}</p>
  <label><input type="checkbox" ${autoOn()?'checked':''} onchange="autoSet(this.checked)">Turn on automatic backups</label><div id="autolist"></div>`}
async function autoRefresh(){const el=$('#autolist');if(!el)return;
  let names;try{names=await autoNames()}catch(e){names=[]}
  if(!$('#autolist'))return;
  if(!names.length){$('#autolist').innerHTML=autoOn()?'<p class="mut">Waiting for the first change…</p>':'<p class="mut">No automatic backups yet.</p>';return}
  const rows=[];for(const [i,n] of names.entries()){let info='';try{const j=JSON.parse(await autoGet(n));info=`${j.cards.length} titles · ${j.decks.length} decks`}catch(e){info='unreadable'}
    rows.push([autoWhen(n)+(i===0?' (latest)':''),info,{h:`<button class="pri" style="padding:6px 10px" onclick="autoRevert('${n}')">↩ Revert to this</button>`}])}
  if($('#autolist'))$('#autolist').innerHTML=`<h4 style="margin:12px 0 4px">↩ Revert changes</h4><p class="mut">Pick a point to go back to. Newer files stay in the list, so you can also step forward again.</p>${tbl(['Saved','Contents',''],rows)}`}
async function autoRevert(name){
  let j;try{j=JSON.parse(await autoGet(name));if(!j.cards||!j.decks)throw 0}catch(e){return toast('That auto-backup could not be read')}
  if(!(await ask(`Revert everything to how it was at ${autoWhen(name)}?\n\nThis replaces what is in the app now (${D.cards.length} titles, ${D.decks.length} decks) with that copy (${j.cards.length} titles, ${j.decks.length} decks). Your other auto-backups and manual backups are not changed.`)))return;
  AUTO_PAUSE=true;fxImgsIn(j);D=j;D.acq=D.acq||[];D.edits=D.edits||[];D.flags=D.flags||[];D.kept=D.kept||{};D.loans=D.loans||[];normSources();fxMigrate();save();AUTO_PAUSE=false;AUTO_LAST=JSON.stringify(D);IDX=null;
  toast('Reverted to '+autoWhen(name));render();fetchArt()}

let HIST=[],EXIT_T=0,LEAVING=false;

function navBack(){
  {const ao=$('#askov');if(ao){ao._no&&ao._no();return true}}
  if(fxBack())return true;

  const z=$('#zoom');if(z){z.remove();return true}

  if(V.view==='add'){
    if(A.step==='done'||A.step==='reading'||A.step==='fail'){A={step:'start'};render();return true}

  if(RO){roExit();return true}

(function(){

    const CApp=window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
