name: Build Android APK
# Runs on every push. The website (GitHub Pages, served from the repo root) updates from the same push,
# so both versions always move together.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Check signing secrets
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret $v (see ANDROID_SETUP.md)"; exit 1; fi
          done
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: npm install
      - run: node scripts/build-www.js
      - run: npx cap add android
      - name: Apply icon, camera permission, version
        run: |
          cp -r android-resources/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build signed release APK
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --out "$RUNNER_TEMP/MtG-DeckMaster-v1.${{ github.run_number }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/MtG-DeckMaster-v1.${{ github.run_number }}.apk"
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.${{ github.run_number }}
          name: MtG DeckMaster Android 1.${{ github.run_number }}
          body: "Android app 1.${{ github.run_number }} — built with the same code as the website at commit ${{ github.sha }}."
          files: ${{ runner.temp }}/MtG-DeckMaster-v1.${{ github.run_number }}.apk
